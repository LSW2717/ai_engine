[workspace]
resolver = "3"
members = [
    "crates/ai-core",
    "crates/ai-cpu",
    "crates/ai-gpu",
    "crates/ai-gpu-runtime",
    "crates/ai-tasks",
    "crates/ai-convert",
    "crates/ai-bench",
    "crates/ai-wasm",
    "crates/ai-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 내부 크레이트
ai-core = { path = "crates/ai-core" }
ai-cpu = { path = "crates/ai-cpu" }
ai-gpu = { path = "crates/ai-gpu" }
ai-gpu-runtime = { path = "crates/ai-gpu-runtime" }
ai-tasks = { path = "crates/ai-tasks" }

# GPU
wgpu = { version = "30", default-features = false }
naga = "30"
# GLB 텍스처 디코드 (items3d) — 순수 Rust 디코더라 wasm 동작
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# 공통
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
thiserror = "2"
log = "0.4"
pollster = "0.4"
futures-channel = "0.3"

# wasm 경계 (wgpu 30이 벤더링한 wasm-bindgen 버전과 일치해야 함)
wasm-bindgen = "0.2.115"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
console_error_panic_hook = "0.1"
console_log = "1"

# dev
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# panic = "abort" 금지: 향후 ai-ffi의 catch_unwind FFI 가드를 침묵 파괴함

[profile.dev.package."*"]
opt-level = 2
