[workspace]
resolver = "3"
members = [
    "crates/ai-core",
    "crates/ai-cpu",
    "crates/ai-gpu",
    "crates/ai-gpu-runtime",
    "crates/ai-tasks",
    "crates/ai-convert",
    "crates/ai-bench",
    "crates/ai-wasm",
    "crates/ai-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 내부 크레이트
ai-core = { path = "crates/ai-core" }
ai-cpu = { path = "crates/ai-cpu" }
ai-gpu = { path = "crates/ai-gpu" }
ai-gpu-runtime = { path = "crates/ai-gpu-runtime" }
ai-tasks = { path = "crates/ai-tasks" }

# GPU — vendor/wgpu 포크 사용 (아래 [patch.crates-io]).
# 포크 사유: webgpu 백엔드에 create_compute_pipeline_webgpu_async 추가 —
# 동기 createComputePipeline 은 브라우저 GPU 프로세스 디바이스 타임라인에서
# 컴파일돼 Windows(FXC)에서 브라우저 전체를 수 초 멈춘다. 업스트림 부재:
# gfx-rs/wgpu#3794. wgpu 버전 올릴 때 vendor/wgpu 재생성 + 패치 재적용 필요.
wgpu = { version = "30", default-features = false }
naga = "30"
# GLB 텍스처 디코드 (items3d) — 순수 Rust 디코더라 wasm 동작
rustfft = "6"
# RNNoise(2017 가중치) 순수 Rust 포트 — 기본 잡음제거. 기본 기능(bin/dasp)은 CLI 전용이라 끈다.
nnnoiseless = { version = "0.5.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# 공통
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
thiserror = "2"
log = "0.4"
pollster = "0.4"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# wasm 경계 (wgpu 30이 벤더링한 wasm-bindgen 버전과 일치해야 함)
wasm-bindgen = "0.2.115"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
console_error_panic_hook = "0.1"
console_log = "1"

# dev
env_logger = "0.11"

[patch.crates-io]
wgpu = { path = "vendor/wgpu" }
# wgpu-hal 포크 사유: Adreno 가 uniformAndStorageBuffer16BitAccess 를 안 줘
# SHADER_F16 이 통째로 꺼지던 것 완화 (vendor/wgpu-hal/src/vulkan/adapter.rs).
wgpu-hal = { path = "vendor/wgpu-hal" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# panic = "abort" 금지: 향후 ai-ffi의 catch_unwind FFI 가드를 침묵 파괴함

[profile.dev.package."*"]
opt-level = 2
