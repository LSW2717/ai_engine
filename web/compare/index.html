<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RVM 엔진 삼자 비교</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border-bottom: 1px solid #8883; padding: .45rem .6rem; text-align: left; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .note { font-size: .85rem; opacity: .75; }
    #status { padding: .5rem .8rem; border-radius: 8px; background: rgba(88,166,255,.12); }
    .err { color: #d1242f; }
  </style>
</head>
<body>
  <h1>RVM 추론 삼자 비교 (144×256, 모델만)</h1>
  <p class="note">동일 조건: 시드 입력 [1,3,144,256], 상태 0 시작 후 프레임 간 피드백,
    워밍업 5프레임 → 30프레임 평균. 각 엔진의 실사용 방식 그대로
    (ORT: 프레임마다 await run(CPU 텐서 왕복 포함) / webgl2·ours: 배치 후 1회 동기화).</p>
  <div id="status">대기 — 자동 시작합니다…</div>
  <table>
    <thead><tr><th>엔진</th><th class="num">ms/frame</th><th class="num">로드(ms)</th><th>비고</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script src="./tfjs/tf.min.js"></script>
  <script src="./tfjs/tf-backend-webgpu.min.js"></script>
  <script type="module" src="./compare.js"></script>
</body>
</html>
