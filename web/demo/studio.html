<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>studio — VideoPipeline 데모 (P1)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    max-width: 1100px; margin: 1.2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
  .note { font-size: .85rem; opacity: .75; margin: 0 0 .9rem; }
  #status { padding: .5rem .8rem; border-radius: 8px; background: rgba(88,166,255,.12);
    margin-bottom: .8rem; font-size: .9rem; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  canvas { border: 1px solid #8886; border-radius: 6px; max-width: 100%; }
  .panel { display: grid; grid-template-columns: 7rem 1fr 3rem; gap: .4rem .6rem;
    align-items: center; min-width: 320px; font-size: .9rem; }
  .panel label { text-align: right; opacity: .85; }
  #hud { font-variant-numeric: tabular-nums; font-size: .85rem; opacity: .8; margin-top: .5rem; }
  button { padding: .35rem .9rem; }
</style>
</head>
<body>
<h1>studio — VideoPipeline (ai_engine WebGPU, CPU 픽셀 0)</h1>
<p class="note">카메라 프레임이 GPU 텍스처로 직행: 전처리 컴퓨트 → 세그 추론 →
시간EMA → joint bilateral 업샘플 → 배경블러(1/5) → 합성(coverage/spill/edge/조도).
프레임당 CPU↔GPU = uniform 몇십 바이트.</p>
<div id="status">대기 — 시작을 누르세요</div>
<button id="start">시작</button>
<div class="row" style="margin-top:.8rem">
  <!-- 백킹 1280×720, CSS 표시 640×360 — 레티나(dpr 2)에서 디바이스 픽셀 1:1.
       백킹=표시 크기로 두면 브라우저가 2배 업스케일해 화질이 뭉개진다.
       3D 아이템은 엔진 wgpu 오버레이가 out 서피스에 직접 그린다 (three.js 제거) -->
  <div style="position:relative; width:640px; height:360px">
    <canvas id="out" width="1280" height="720" style="width:640px; height:360px"></canvas>
  </div>
  <div class="panel">
    <label>배경</label>
    <select id="bg">
      <option value="none">없음</option>
      <option value="color">단색(초록)</option>
      <option value="asset:1">스터디 1</option>
      <option value="asset:2">스터디 2</option>
      <option value="asset:3">스터디 3</option>
      <option value="asset:4">스터디 4</option>
      <option value="asset:5">스터디 5</option>
      <option value="asset:6">스터디 6</option>
      <option value="image">파일…</option>
    </select>
    <input type="file" id="bgfile" accept="image/*" style="grid-column: span 1" />
    <label>3D 아이템</label>
    <select id="item" style="grid-column: span 2">
      <option value="none">없음</option>
      <option value="hat1">모자 1</option>
      <option value="hat3">모자 3</option>
      <option value="hat_christmas">산타 모자</option>
      <option value="hat_cat_ears">고양이 귀</option>
      <option value="glasses1">안경 1</option>
      <option value="glasses_heart">하트 안경</option>
      <option value="mustache1">콧수염</option>
    </select>
    <label>티어</label>
    <select id="tier">
      <option value="auto">auto (66ms 강등)</option>
      <option value="a">A — GPU 추론</option>
      <option value="b">B — CPU 추론+GPU 합성</option>
    </select><span id="tierv"></span>
    <label>조명</label><input type="checkbox" id="light" /><span></span>
    <label>집중도</label><input type="checkbox" id="focus" /><span></span>
    <label>프레이밍</label><input type="checkbox" id="framing" /><span id="framingv"></span>
    <label>미러</label><input type="checkbox" id="mirror" /><span></span>
    <label>회전</label>
    <select id="degree">
      <option value="0">0°</option>
      <option value="90">90°</option>
      <option value="180">180°</option>
      <option value="270">270°</option>
    </select><span></span>
    <label>블러</label><input type="range" id="blur" min="0" max="100" value="0" /><span id="blurv">0</span>
    <label>밝기(배경)</label><input type="range" id="bright" min="0" max="200" value="100" /><span id="brightv">100</span>
    <label>흑백(배경)</label><input type="range" id="gray" min="0" max="100" value="0" /><span id="grayv">0</span>
  </div>
</div>
<div id="hud"></div>
<div id="focushud" style="font-variant-numeric: tabular-nums; font-size: .85rem; opacity: .8;"></div>
<canvas id="src" width="640" height="360" style="display:none"></canvas>
<script type="module" src="studio.js"></script>
</body>
</html>
