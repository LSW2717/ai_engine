<!doctype html><meta charset="utf-8"><title>segm engine test</title>
<div id="status">로딩…</div>
<script type="module">
// gl-segm plan 스모크 — 엔진이 로드·추론되고 마스크가 살아있는지 (임시 게이트)
const log = (l) => console.log('AI_ENGINE_RESULT: ' + l);
try {
  const { Webgl2Engine } = await import('./vendor/webgl2-engine-span.js');
  const canvas = document.createElement('canvas');
  canvas.width = 8; canvas.height = 8;
  const gl = canvas.getContext('webgl2', { antialias: false });
  const eng = new Webgl2Engine(gl, {});
  await eng.load('./vendor/segm_160x288.plan.json', './vendor/segm_160x288.weights.bin');
  const rec = eng.tex.get('input_1');
  log(`input rec W=${rec.W} H=${rec.H}`);
  // 테스트 프레임 (실제 사람) → NCHW 플래너 입력
  const img = new Image();
  img.src = '../models/mediapipe/frame_256x144.rgb' ? '' : '';
  // rgb 파일 로드 (256x144 rgb24) 후 288x160으로 캔버스 리샘플
  const buf = new Uint8Array(await (await fetch('../models/mediapipe/frame_256x144.rgb')).arrayBuffer());
  const c2 = document.createElement('canvas'); c2.width = 256; c2.height = 144;
  const cx2 = c2.getContext('2d');
  const id = cx2.createImageData(256, 144);
  for (let i = 0, j = 0; j < buf.length; i += 4, j += 3) {
    id.data[i] = buf[j]; id.data[i+1] = buf[j+1]; id.data[i+2] = buf[j+2]; id.data[i+3] = 255;
  }
  cx2.putImageData(id, 0, 0);
  const c3 = document.createElement('canvas'); c3.width = 288; c3.height = 160;
  c3.getContext('2d').drawImage(c2, 0, 0, 288, 160);
  const d = c3.getContext('2d').getImageData(0, 0, 288, 160).data;
  const plane = 288 * 160;
  const nchw = new Float32Array(3 * plane);
  for (let p = 0, q = 0; q < plane; p += 4, q++) {
    nchw[q] = d[p] / 255; nchw[plane + q] = d[p+1] / 255; nchw[2*plane + q] = d[p+2] / 255;
  }
  eng.upload('input_1', nchw);
  eng.run();
  const out = eng.read('segment');
  let fg = 0, mn = 1e9, mx = -1e9;
  // segment: 2ch 로짓 — softmax ch1 확률로 전경비율
  const n = out.length / 2;
  for (let i = 0; i < n; i++) {
    const a = out[i], b = out[n + i];
    const m = Math.max(a, b);
    const p1 = Math.exp(b - m) / (Math.exp(a - m) + Math.exp(b - m));
    if (p1 > 0.5) fg++;
    mn = Math.min(mn, p1); mx = Math.max(mx, p1);
  }
  log(`segm mask fg=${(fg / n * 100).toFixed(1)}% min=${mn.toFixed(3)} max=${mx.toFixed(3)}`);
  log((fg / n > 0.03 && fg / n < 0.7 && mx > 0.9) ? 'verdict PASS' : 'verdict FAIL');
} catch (e) {
  log('fatal ' + String(e).slice(0, 300));
  log('verdict FAIL');
}
log('done');
</script>
